<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 背景：朱红圆角方形（呼应中国红，站内主色调） -->
  <rect width="200" height="200" rx="36" fill="#8E2323"/>
  <!-- 金色线条组：统一描边样式（金线 #F0C75E，粗 12，圆角端点/拐角） -->
  <g stroke="#F0C75E" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 外圈：圆形边框，圈定整体构图 -->
    <circle cx="100" cy="100" r="85"/>
    <!-- 殿顶：折线构成人字形屋顶（左 30,70 → 顶 100,15 → 右 170,70） -->
    <path d="M 30 70 L 100 15 L 170 70"/>
    <!-- 左立柱：宫殿门柱 -->
    <rect x="65" y="70" width="18" height="65"/>
    <!-- 右立柱：宫殿门柱 -->
    <rect x="117" y="70" width="18" height="65"/>
    <!-- 水波 1：底部第一道弧线（象征朝代如水流） -->
    <path d="M 20 150 Q 100 120 180 150"/>
    <!-- 水波 2：底部第二道弧线 -->
    <path d="M 20 170 Q 100 140 180 170"/>
  </g>
  <!-- 顶饰：屋顶正中的金色圆点（日/明珠，点睛之笔） -->
  <circle cx="100" cy="75" r="14" fill="#F0C75E"/>
</svg>
